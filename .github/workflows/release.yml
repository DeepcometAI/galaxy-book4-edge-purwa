name: Release DTB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create (e.g. v1.2.0 or v1.2.0-rc1). Required for manual runs.'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build DTB
        id: build
        uses: ./.github/actions/build-dtb

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # Standard semver convention: a hyphen marks a pre-release
            # (v1.2.0-rc1, v1.2.0-beta) vs a plain release (v1.2.0).
            case "$TAG" in
              *-*) PRERELEASE=true ;;
              *)   PRERELEASE=false ;;
            esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Checksum DTB
        shell: bash
        run: sha256sum "${{ steps.build.outputs.dtb-path }}" > "${{ steps.build.outputs.dtb-path }}.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.dtb-path }}
            ${{ steps.build.outputs.dtb-path }}.sha256
            dts/x1p26100-samsung-galaxy-book4-edge-15.dts
